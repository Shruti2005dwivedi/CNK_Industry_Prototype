<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tax & Regulatory Knowledge Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { --bg:#0f1115; --panel:#171a21; --accent:#4f8cff; --text:#e6e8ec; --muted:#8b93a3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid #262a33; }
  header h1 { font-size:16px; margin:0; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  #chat { max-width:820px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:14px; min-height:60vh; }
  .msg { padding:12px 16px; border-radius:10px; max-width:85%; line-height:1.5; font-size:14px; }
  .user { align-self:flex-end; background:var(--accent); color:white; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid #262a33; }
  .bot.not-found { border-color:#7a4a1f; }
  .citations { margin-top:8px; font-size:12px; color:var(--muted); }
  .citations span { display:inline-block; background:#20242e; padding:3px 8px; border-radius:6px; margin:2px 4px 0 0; }
  #inputRow { max-width:820px; margin:0 auto; padding:16px 20px; display:flex; gap:8px; border-top:1px solid #262a33; }
  #q { flex:1; padding:12px 14px; border-radius:8px; border:1px solid #262a33; background:var(--panel); color:var(--text); font-size:14px; }
  button { padding:12px 18px; border-radius:8px; border:none; background:var(--accent); color:white; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #uploadRow { max-width:820px; margin:0 auto; padding:0 20px 16px; display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>RAG-Driven Tax & Regulatory Knowledge Assistant</h1>
  <p>Ask a compliance question — every answer is grounded in ingested circulars, with citations.</p>
</header>

<div id="uploadRow">
  <input type="file" id="pdfFile" accept="application/pdf" />
  <button id="uploadBtn">Ingest PDF</button>
  <span id="uploadStatus"></span>
</div>

<div id="chat"></div>

<div id="inputRow">
  <input id="q" type="text" placeholder="e.g. Can ITC be claimed on a delayed invoice?" />
  <button id="sendBtn">Ask</button>
</div>

<script>
  const API_BASE = "http://localhost:8000"; // point this at your deployed backend
  const sessionId = "demo-" + Math.random().toString(36).slice(2, 8);
  const chat = document.getElementById("chat");

  function addMessage(text, cls, citations) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    if (citations && citations.length) {
      const c = document.createElement("div");
      c.className = "citations";
      citations.forEach(cit => {
        const s = document.createElement("span");
        s.textContent = `${cit.source_document} · ${cit.section_reference || "—"} · ${cit.date_of_issue || "—"}`;
        c.appendChild(s);
      });
      div.appendChild(c);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function ask() {
    const input = document.getElementById("q");
    const query = input.value.trim();
    if (!query) return;
    addMessage(query, "user");
    input.value = "";
    document.getElementById("sendBtn").disabled = true;

    try {
      const res = await fetch(`${API_BASE}/query`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, session_id: sessionId }),
      });
      const data = await res.json();
      addMessage(data.answer, "bot" + (data.grounded ? "" : " not-found"), data.citations);
    } catch (err) {
      addMessage("Error reaching backend: " + err.message, "bot not-found");
    } finally {
      document.getElementById("sendBtn").disabled = false;
    }
  }

  async function uploadPdf() {
    const fileInput = document.getElementById("pdfFile");
    const status = document.getElementById("uploadStatus");
    if (!fileInput.files.length) return;
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    status.textContent = "Uploading & indexing...";
    try {
      const res = await fetch(`${API_BASE}/ingest`, { method: "POST", body: formData });
      const data = await res.json();
      status.textContent = `Indexed ${data.chunks_created} chunks from ${data.filename}`;
    } catch (err) {
      status.textContent = "Upload failed: " + err.message;
    }
  }

  document.getElementById("sendBtn").addEventListener("click", ask);
  document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
  document.getElementById("uploadBtn").addEventListener("click", uploadPdf);
</script>
</body>
</html>
